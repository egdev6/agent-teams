name: "Vitest Testing Worker"
description: "Specialist in Vitest unit and integration tests. Creates, modifies, and debugs tests with best practices."

_metadata:
  id: vitest-worker
  role: worker
  domain: testing
  subdomains: ["unit", "integration"]
  
  invocation:
    aliases: ["@vitest-worker", "@vitest"]
    entrypoint: "agent:vitest-worker"
  
  intents:
    - "test_creation"
    - "test_modification"
    - "test_debugging"
    - "mock_setup"
    - "assertion_improvement"
  
  # Placeholders resolved from project.profile.yml
  path_globs:
    - "{{paths.tests_root}}/**/*.test.ts"
    - "{{paths.tests_root}}/**/*.spec.ts"
    - "{{paths.frontend_root}}/**/*.test.tsx"
    - "**/__tests__/**/*.ts"
  
  keywords:
    - "vitest"
    - "test"
    - "spec"
    - "expect"
    - "mock"
    - "assert"
    - "describe"
    - "it"
  
  context:
    packs:
      - "project:architecture"      # From project profile
      - "project:conventions"        # From project profile
      - "kit:testing-patterns"       # From kit
      - "kit:vitest-best-practices"  # From kit
    max_files: 8
    max_chars_per_file: 8000
  
  output:
    mode_default: "short+diff"
    never_include:
      - "disclaimers"
      - "placeholders"
      - "apologies"
  
  skills:
    allowed:
      - "file_edit"
      - "file_create"
      - "search_codebase"
      - "run_terminal"
      - "run_tests"         # Custom skill from kit
  
  # Commands resolved from project profile
  commands:
    test: "{{commands.test}}"
    coverage: "{{commands.test_coverage}}"
    watch: "{{commands.test_watch}}"
