name: Version and Tag

on:
  push:
    branches:
      - main

concurrency:
  group: version-and-tag
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Process changesets and tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v3
        with:
          version: '10.30.3'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Check for pending changesets
        id: check
        run: |
          PENDING=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' 2>/dev/null | wc -l)
          echo "pending=$PENDING" >> "$GITHUB_OUTPUT"
          echo "Pending changesets: $PENDING"

      - name: Apply changesets (version bump + changelog)
        if: steps.check.outputs.pending != '0'
        run: pnpm release:version

      - name: Commit version bumps and changelogs
        if: steps.check.outputs.pending != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "ci: version bump and changelog [skip ci]"
          git push

      - name: Read new extension version
        if: steps.check.outputs.pending != '0'
        id: version
        run: |
          VERSION=$(node -p "require('./packages/extension/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $VERSION"

      - name: Build monorepo
        if: steps.check.outputs.pending != '0'
        run: pnpm build

      - name: Package extension
        if: steps.check.outputs.pending != '0'
        id: package
        working-directory: packages/extension
        run: |
          pnpm exec vsce package --no-dependencies
          VSIX=$(ls *.vsix | head -1)
          echo "vsix_name=$VSIX" >> "$GITHUB_OUTPUT"
          echo "Packaged: $VSIX"

      - name: Extract CHANGELOG entry for this version
        if: steps.check.outputs.pending != '0'
        id: changelog
        run: |
          VERSION_NUM="${{ steps.version.outputs.version }}"
          NOTES=$(awk "/^## (\[)?v?${VERSION_NUM//./\\.}/,/^## (\[)?v?[0-9]/" CHANGELOG.md \
            | head -n -1 \
            | tail -n +2)
          if [ -z "$NOTES" ]; then
            NOTES=$(grep -A 50 "v${VERSION_NUM}" CHANGELOG.md | head -50)
          fi
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Publish release and sync CHANGELOG to docs repo
        if: steps.check.outputs.pending != '0'
        env:
          GH_TOKEN: ${{ secrets.DOCS_REPO_PAT }}
          DOCS_REPO: egdev6/agent-teams-docs
          TAG: v${{ steps.version.outputs.version }}
          VSIX_PATH: packages/extension/${{ steps.package.outputs.vsix_name }}
        run: |
          # Create GitHub Release in docs repo with .vsix attached
          gh release create "$TAG" \
            --repo "$DOCS_REPO" \
            --title "Agent Teams $TAG" \
            --notes "${{ steps.changelog.outputs.notes }}" \
            "$VSIX_PATH"

          # Sync CHANGELOG to docs repo
          gh repo clone "$DOCS_REPO" docs-repo
          cp CHANGELOG.md docs-repo/CHANGELOG.md
          cd docs-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "docs: sync CHANGELOG for $TAG [skip ci]"
          git push
