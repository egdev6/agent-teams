name: Version and Tag

on:
  push:
    branches:
      - main

concurrency:
  group: version-and-tag
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: Process changesets and tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: '10.30.3'

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Check for pending changesets
        id: check
        run: |
          PENDING=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' 2>/dev/null | wc -l)
          echo "pending=$PENDING" >> "$GITHUB_OUTPUT"
          echo "Pending changesets: $PENDING"

      - name: Apply changesets (version bump + changelog)
        if: steps.check.outputs.pending != '0'
        run: pnpm release:version

      - name: Land the version bump through a pull request
        if: steps.check.outputs.pending != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ci/version-bump-${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit, skipping"
            exit 0
          fi
          git commit --no-verify -m "ci: version bump and changelog"
          git checkout -b "$BRANCH"
          git push --no-verify origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "ci: version bump and changelog [skip ci]" \
            --body "Automated version bump and changelog generated from the pending changesets.\n\nOpened as a pull request because \`main\` requires one. Merging it immediately satisfies that\nrule with zero required approvals, so no bypass is needed; direct pushes are no longer possible\non a personal repository."
          gh pr merge "$BRANCH" --squash
          git push origin --delete "$BRANCH" || true

      - name: Read new extension version
        if: steps.check.outputs.pending != '0'
        id: version
        run: |
          VERSION=$(node -p "require('./packages/extension/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $VERSION"

      - name: Build monorepo
        if: steps.check.outputs.pending != '0'
        run: pnpm build

      - name: Package extension
        if: steps.check.outputs.pending != '0'
        id: package
        working-directory: packages/extension
        run: |
          pnpm exec vsce package --no-dependencies
          VSIX=$(ls *.vsix | head -1)
          echo "vsix_name=$VSIX" >> "$GITHUB_OUTPUT"
          echo "Packaged: $VSIX"

      - name: Extract CHANGELOG entry for this version
        if: steps.check.outputs.pending != '0'
        run: |
          node scripts/extract-changelog-entry.cjs "${{ steps.version.outputs.version }}" > release-notes.md

      - name: Publish release and sync CHANGELOG to docs repo
        if: steps.check.outputs.pending != '0'
        env:
          GH_TOKEN: ${{ secrets.DOCS_REPO_PAT }}
          DOCS_REPO: egdev6/agent-teams-docs
          TAG: v${{ steps.version.outputs.version }}
          VSIX_PATH: packages/extension/${{ steps.package.outputs.vsix_name }}
        run: |
          # Create GitHub Release in docs repo with .vsix attached
          gh release create "$TAG" \
            --repo "$DOCS_REPO" \
            --title "Agent Teams $TAG" \
            --notes-file release-notes.md \
            "$VSIX_PATH"

          # Sync CHANGELOG to docs repo
          gh auth setup-git
          gh repo clone "$DOCS_REPO" docs-repo
          cp CHANGELOG.md docs-repo/CHANGELOG.md
          cd docs-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "docs: sync CHANGELOG for $TAG [skip ci]"
          git push
