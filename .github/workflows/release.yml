name: Release (Manual Fallback)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release in docs repo (e.g., v2.1.0)'
        required: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate release prerequisites
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version_num: ${{ steps.version.outputs.version_num }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          TAG="${{ inputs.version }}"
          VERSION_NUM="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_num=$VERSION_NUM" >> "$GITHUB_OUTPUT"

      - name: Check extension package.json version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./packages/extension/package.json').version")
          TAG_VERSION="${{ steps.version.outputs.version_num }}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: packages/extension/package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Check no unprocessed changesets remain
        run: |
          PENDING=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' 2>/dev/null | wc -l)
          if [ "$PENDING" -gt 0 ]; then
            echo "ERROR: There are $PENDING unprocessed changeset file(s) in .changeset/."
            echo "Run 'pnpm release:version' locally and commit the result before tagging."
            find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md'
            exit 1
          fi

      - name: Check CHANGELOG.md has entry for this version
        run: |
          VERSION_NUM="${{ steps.version.outputs.version_num }}"
          if ! grep -qE "^## (\[)?v?${VERSION_NUM//./\\.}(\])?" CHANGELOG.md; then
            echo "ERROR: No entry found for $VERSION_NUM in CHANGELOG.md"
            exit 1
          fi

  create-tag-in-docs:
    name: Create release tag in docs repo
    needs: validate
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.validate.outputs.tag }}
      DOCS_REPO: egdev6/agent-teams-docs
      GH_TOKEN: ${{ secrets.DOCS_REPO_PAT }}
    steps:
      - name: Create tag in docs repo
        run: |
          echo "$GH_TOKEN" | gh auth login --with-token
          DOCS_SHA=$(gh api "repos/${DOCS_REPO}/git/refs/heads/main" --jq '.object.sha')
          gh api "repos/${DOCS_REPO}/git/refs" \
            --method POST \
            --field ref="refs/tags/${TAG}" \
            --field sha="${DOCS_SHA}"
          echo "Created tag ${TAG} in ${DOCS_REPO} at ${DOCS_SHA}"
