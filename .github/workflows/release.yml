name: Release (Manual Fallback)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release in docs repo (e.g., v2.1.0)'
        required: true

permissions:
  contents: read

jobs:
  build-and-release:
    name: Build, package, and publish release
    runs-on: ubuntu-latest
    env:
      DOCS_REPO: egdev6/agent-teams-docs
      GH_TOKEN: ${{ secrets.DOCS_REPO_PAT }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          TAG="${{ inputs.version }}"
          VERSION_NUM="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_num=$VERSION_NUM" >> "$GITHUB_OUTPUT"

      - name: Validate prerequisites
        run: |
          PKG_VERSION=$(node -p "require('./packages/extension/package.json').version")
          TAG_VERSION="${{ steps.version.outputs.version_num }}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: packages/extension/package.json ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          PENDING=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' 2>/dev/null | wc -l)
          if [ "$PENDING" -gt 0 ]; then
            echo "ERROR: $PENDING unprocessed changeset(s) remain in .changeset/"
            exit 1
          fi
          if ! grep -qE "^## (\[)?v?${TAG_VERSION//./\\.}(\])?" CHANGELOG.md; then
            echo "ERROR: No entry for $TAG_VERSION in CHANGELOG.md"
            exit 1
          fi

      - uses: pnpm/action-setup@v3
        with:
          version: '8.15.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build monorepo
        run: pnpm build

      - name: Package extension
        id: package
        working-directory: packages/extension
        run: |
          pnpm exec vsce package --no-dependencies
          VSIX=$(ls *.vsix | head -1)
          echo "vsix_name=$VSIX" >> "$GITHUB_OUTPUT"
          echo "Packaged: $VSIX"

      - name: Extract CHANGELOG entry
        id: changelog
        run: |
          VERSION_NUM="${{ steps.version.outputs.version_num }}"
          NOTES=$(awk "/^## (\[)?v?${VERSION_NUM//./\\.}/,/^## (\[)?v?[0-9]/" CHANGELOG.md \
            | head -n -1 | tail -n +2)
          if [ -z "$NOTES" ]; then
            NOTES=$(grep -A 50 "v${VERSION_NUM}" CHANGELOG.md | head -50)
          fi
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Publish release and sync CHANGELOG to docs repo
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VSIX_PATH: packages/extension/${{ steps.package.outputs.vsix_name }}
        run: |
          gh release create "$TAG" \
            --repo "$DOCS_REPO" \
            --title "Agent Teams $TAG" \
            --notes "${{ steps.changelog.outputs.notes }}" \
            "$VSIX_PATH"

          gh auth setup-git
          gh repo clone "$DOCS_REPO" docs-repo
          cp CHANGELOG.md docs-repo/CHANGELOG.md
          cd docs-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "docs: sync CHANGELOG for $TAG [skip ci]"
          git push
