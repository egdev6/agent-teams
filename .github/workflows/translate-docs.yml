name: Translate Documentation to English

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**/*.md'
      - 'README.md'
      - 'CHANGELOG.md'

  workflow_dispatch:
    inputs:
      force_translate:
        description: 'Force translate all docs'
        required: false
        default: 'false'

jobs:
  translate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install deepl-node

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            docs/**/*.md
            README.md
            CHANGELOG.md

      - name: Translate changed docs
        if: steps.changed-files.outputs.any_changed == 'true' || github.event.inputs.force_translate == 'true'
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          node scripts/translate-docs.js "${{ steps.changed-files.outputs.all_changed_files }}" "${{ github.event.inputs.force_translate }}"

      - name: Checkout main-EN
        run: |
          git fetch origin main-EN
          git checkout main-EN

      - name: Copy translated files
        run: |
          git checkout main -- docs/
          git checkout main -- README.md
          git checkout main -- CHANGELOG.md
          # Los archivos traducidos están en docs-en/
          if [ -d "docs-en" ]; then
            cp -r docs-en/* docs/
            rm -rf docs-en
          fi
          if [ -f "README-EN.md" ]; then
            mv README-EN.md README.md
          fi
          if [ -f "CHANGELOG-EN.md" ]; then
            mv CHANGELOG-EN.md CHANGELOG.md
          fi

      - name: Commit and push to main-EN
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "docs: Auto-translate documentation to English"
          git push origin main-EN
