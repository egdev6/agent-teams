# Project Profile for Agent Team v2.0
# This file defines project-specific configuration that kits use to compose agents

project:
  id: my-web-app
  name: My Web Application
  version: 1.0.0
  type: frontend
  description: A modern web application built with React and TypeScript

# Technologies enabled in this project
technologies:
  typescript: true
  react: true
  vitest: true
  playwright: true
  tailwindcss: true

# Project-specific paths (used by kit placeholders)
paths:
  root: .
  src: ./src
  frontend_root: ./src
  backend_root: ./server
  tests_root: ./tests
  e2e_tests: ./e2e
  components: ./src/components
  api: ./server/api
  config: ./config
  docs: ./docs

# Project-specific commands (used by kit placeholders)
commands:
  build: pnpm build
  dev: pnpm dev
  test: pnpm test
  test_coverage: pnpm test:coverage
  test_watch: pnpm test:watch
  test_ui: pnpm test:ui
  lint: pnpm lint
  format: pnpm format
  e2e: pnpm test:e2e
  typecheck: pnpm typecheck

# Project context packs (available as project:* in agents)
context_packs:
  - architecture
  - conventions
  - api-design
  - tech-stack        # NEW: Dynamic context pack with conditionals
  - testing           # NEW: Dynamic testing guidelines
  - paths-reference   # NEW: Auto-generated paths documentation

# Project-level overrides for all agents
overrides:
  # Token safety
  token_safety:
    max_files_read: 10
    max_chars_per_file: 10000

  # All agents should use these path globs
  path_globs:
    - "src/**/*.{ts,tsx}"
    - "tests/**/*.test.ts"
    - "!**/node_modules/**"
    - "!**/dist/**"

  # Common delegation config
  delegation_config:
    routing_strategy: router_split
    max_handoff_depth: 3
