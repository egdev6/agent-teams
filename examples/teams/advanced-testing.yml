# Advanced Team Configuration Example
# Sprint 6: Advanced Composition features

id: advanced-testing
name: Advanced Testing Team
description: Complete testing setup with customized agent behavior per project
version: 1.0.0

# Kits to include
kits:
  - testing-vitest

# Agent selection
agents:
  enable: all  # Enable all agents from selected kits
  # disable: []  # Optionally disable specific agents

# Advanced per-agent overrides
# Allows fine-tuning each agent's behavior for this team
overrides:
  
  # Example 1: Customize test worker for this project
  vitest-worker:
    # Override context limits
    context:
      max_files: 12           # More files than default
      max_chars_per_file: 10000  # Larger files
      packs:
        - project:architecture
        - project:testing-setup
        - kit:vitest-best-practices
        - kit:mocking-patterns   # Additional pack
    
    # Override output preferences
    output:
      mode_default: diff       # Use diff mode instead of short+diff
      max_bullets: 10
      never_include:
        - "*.config.js"
        - "**/node_modules/**"
    
    # Add more skills
    skills:
      allowed:
        - file_edit
        - file_create
        - run_terminal
        - run_tests
        - analyze_coverage
        - generate_mocks      # Custom skill
    
    # Override intents to be more specific
    intents:
      - test_creation
      - test_debugging
      - test_refactoring
      - snapshot_update
    
    # Override keywords for better routing
    keywords:
      - vitest
      - test
      - expect
      - mock
      - spy
      - coverage
      - snapshot

  # Example 2: Customize test orchestrator
  test-orchestrator:
    # Reduce delegation depth for simpler projects
    delegation:
      strategy: agent_handoff
      max_handoffs: 2         # Reduced from default 3
      allowed_subagents:
        - vitest-worker
        # Only allow vitest-worker, not others
    
    # Orchestrators don't need as many context files
    context:
      max_files: 5
      max_chars_per_file: 5000
      packs:
        - project:architecture
        - kit:testing-patterns
    
    # Orchestrators prefer plan mode
    output:
      mode_default: plan
      max_bullets: 7

  # Example 3: Add overrides for future agents
  integration-test-worker:
    context:
      max_files: 15
      packs:
        - project:api-contracts
        - project:test-data
        - kit:integration-patterns
    
    intents:
      - integration_test_creation
      - api_test_debugging
      - e2e_scenario_design
    
    path_globs:
      - "tests/integration/**/*.test.ts"
      - "tests/e2e/**/*.spec.ts"

# Notes:
# - Overrides cascade: Kit defaults → Project profile → Team overrides
# - Use merge strategy 'team-priority' (default) to prioritize team values
# - Dry-run mode shows exactly what will change before applying
# - All override fields are optional - only specify what you want to change
